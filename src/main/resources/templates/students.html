<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý sinh viên</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- AdminLTE css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link text-center">
      <span class="brand-text font-weight-light">University Training</span>
    </a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="#" class="nav-link active">
              <i class="nav-icon fas fa-user-friends"></i>
              <p>Sinh viên</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Quản lý sinh viên</h1>
          </div>
        </div>
      </div>
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="card-title"><i class="fas fa-user-friends mr-1"></i> Danh sách sinh viên</h3>
            <div class="card-tools ml-auto">
              <!-- Nút mở Modal Thêm mới -->
              <button type="button" class="btn btn-primary btn-sm" onclick="showAddModal()">
                <i class="fas fa-plus-circle"></i> Thêm sinh viên
              </button>
            </div>
          </div>
          
          <div class="card-body">
            <!-- Tìm kiếm -->
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="input-group">
                  <input type="text" id="searchInput" class="form-control" placeholder="Tìm mã SV, họ tên, email...">
                  <span class="input-group-append">
                    <button type="button" class="btn btn-primary" onclick="searchStudents()"><i class="fas fa-search"></i> Tìm kiếm</button>
                  </span>
                </div>
              </div>
            </div>

            <!-- Bảng dữ liệu -->
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                    <th class="text-center">STT</th>
                    <th>Mã sinh viên</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Lớp</th>
                    <th class="text-center" style="width: 150px">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="student-table-body">
                    <!-- Dữ liệu sẽ được render bằng JS -->
                </tbody>
                </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Modal Thêm/Sửa Sinh Viên -->
<div class="modal fade" id="studentModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Thêm sinh viên mới</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form id="studentForm">
          <!-- Trường ẩn lưu ID khi cập nhật -->
          <input type="hidden" id="studentId">
          
          <div class="form-group">
            <label>Mã sinh viên</label>
            <input type="text" class="form-control" id="studentCode" required>
          </div>
          <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" class="form-control" id="fullName" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" class="form-control" id="phone">
          </div>
          <div class="form-group">
            <label>Lớp</label>
            <input type="text" class="form-control" id="className">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Đóng</button>
        <button type="button" class="btn btn-primary" onclick="saveStudent()">Lưu lại</button>
      </div>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'http://localhost:8080/api/students';

    // Tải dữ liệu khi trang vừa mở
    $(document).ready(function() {
        loadStudents();
    });

    // 1. API GET: Lấy danh sách sinh viên
    function loadStudents(keyword = '') {
        let url = API_URL;
        if (keyword) {
            url += '?keyword=' + encodeURIComponent(keyword);
        }

        $.ajax({
            url: url,
            type: 'GET',
            success: function(students) {
                let tbody = $('#student-table-body');
                tbody.empty();

                if (students.length === 0) {
                    tbody.append('<tr><td colspan="7" class="text-center">Không có dữ liệu</td></tr>');
                    return;
                }

                $.each(students, function(index, student) {
                    let row = `
                        <tr>
                            <td class="text-center">${index + 1}</td>
                            <td>${student.studentCode}</td>
                            <td>${student.fullName}</td>
                            <td>${student.email}</td>
                            <td>${student.phone}</td>
                            <td>${student.className}</td>
                            <td class="text-center">
                                <button class="btn btn-warning btn-sm text-white" onclick="showEditModal('${student.id}')"><i class="fas fa-pen"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="deleteStudent('${student.id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                    tbody.append(row);
                });
            },
            error: function() {
                alert('Lỗi khi tải danh sách sinh viên!');
            }
        });
    }

    // 2. Chức năng Tìm kiếm
    function searchStudents() {
        let keyword = $('#searchInput').val();
        loadStudents(keyword);
    }

    // 3. Hiển thị Modal Thêm mới
    function showAddModal() {
        $('#studentForm')[0].reset(); // Xóa trắng form
        $('#studentId').val('');      // Xóa ID ẩn
        $('#modalTitle').text('Thêm sinh viên mới');
        $('#studentModal').modal('show');
    }

    // 4. API GET (ID): Lấy chi tiết 1 sinh viên đổ vào Modal để Sửa
    function showEditModal(id) {
        $.ajax({
            url: API_URL + '/' + id,
            type: 'GET',
            success: function(student) {
                // Đổ dữ liệu vào form
                $('#studentId').val(student.id);
                $('#studentCode').val(student.studentCode);
                $('#fullName').val(student.fullName);
                $('#email').val(student.email);
                $('#phone').val(student.phone);
                $('#className').val(student.className);
                
                $('#modalTitle').text('Cập nhật sinh viên');
                $('#studentModal').modal('show');
            },
            error: function() {
                alert('Lỗi khi lấy thông tin sinh viên!');
            }
        });
    }

    // 5. API POST / PUT: Lưu sinh viên (Thêm mới hoặc Cập nhật)
    function saveStudent() {
        let id = $('#studentId').val();
        let studentData = {
            studentCode: $('#studentCode').val(),
            fullName: $('#fullName').val(),
            email: $('#email').val(),
            phone: $('#phone').val(),
            className: $('#className').val()
        };

        let method = id ? 'PUT' : 'POST';
        let url = id ? API_URL + '/' + id : API_URL;

        $.ajax({
            url: url,
            type: method,
            contentType: 'application/json',
            data: JSON.stringify(studentData),
            success: function() {
                $('#studentModal').modal('hide');
                loadStudents(); // Tải lại bảng sau khi lưu thành công
                alert(id ? 'Cập nhật thành công!' : 'Thêm mới thành công!');
            },
            error: function() {
                alert('Lỗi khi lưu sinh viên!');
            }
        });
    }

    // 6. API DELETE: Xóa sinh viên
    function deleteStudent(id) {
        if (confirm('Bạn có chắc chắn muốn xóa sinh viên này không?')) {
            $.ajax({
                url: API_URL + '/' + id,
                type: 'DELETE',
                success: function() {
                    loadStudents(); // Tải lại bảng sau khi xóa
                    alert('Đã xóa sinh viên!');
                },
                error: function() {
                    alert('Lỗi khi xóa sinh viên!');
                }
            });
        }
    }
</script>
</body>
</html>
